name: Automotive CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: automotive-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: production
      VITE_SUPABASE_URL: https://findit-release-validation.supabase.co
      VITE_SUPABASE_ANON_KEY: release-validation-key
      VITE_FEATURE_BUSINESS_PROFILES: "true"
      VITE_FEATURE_MESSAGING: "true"
      VITE_FEATURE_ESSENTIAL_NOTIFICATIONS: "true"
      VITE_AUTH_GOOGLE_ENABLED: "true"
      VITE_FEATURE_GOOGLE_OAUTH: "true"
      VITE_FEATURE_MAPS: "true"
      VITE_MAPTILER_PUBLIC_KEY: release-validation-maptiler-key
      VITE_MAPTILER_STYLE_ID: streets-v4
      VITE_FEATURE_INTERNATIONAL_LISTING: "false"
      VITE_FEATURE_MANUAL_LOCATION: "true"
      VITE_FEATURE_CURRENT_LOCATION: "true"
      VITE_FEATURE_CURRENCY_CONVERSION: "false"
      VITE_FEATURE_PHONE_VERIFICATION: "false"
      VITE_FEATURE_SERVICE_RADIUS: "false"
      VITE_FEATURE_REPORTING: "true"
      VITE_FEATURE_PAYMENTS: "false"
      VITE_FEATURE_SUBSCRIPTIONS: "false"
      VITE_FEATURE_ESCROW: "false"
      VITE_FEATURE_PREMIUM_LISTINGS: "false"
      VITE_FEATURE_AI_MODERATION: "false"
      VITE_FEATURE_AI_BAN_EVASION: "false"
      VITE_FEATURE_AI_TICKET_TRIAGE: "false"
      VITE_FEATURE_AI_SUPPORT_CHAT: "false"
      VITE_FEATURE_SCHEDULED_REMINDERS: "false"
      VITE_FEATURE_MARKETING_EMAILS: "false"
      VITE_FEATURE_LISTING_EXPIRY: "false"
      VITE_FEATURE_LISTING_FRESHNESS_REMINDERS: "false"
      VITE_FEATURE_TOURS: "true"
      VITE_FEATURE_TOURS_PREVIEW: "false"
      VITE_FEATURE_PREVIEW_FIXTURES: "false"
      VITE_PREVIEW_AUTH_BYPASS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Normalize locked dependency metadata
        run: node ./scripts/normalize-package-lock.mjs --write

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev --ignore-scripts

      - name: Verify source graph
        run: npm run verify:source-graph

      - name: Verify repository hygiene
        run: npm run verify:hygiene

      - name: Verify SQL migration boundary
        run: npm run verify:sql-boundary

      - name: Run automotive contract tests
        run: >-
          node --test
          ./tests/automotive*.test.mjs
          ./tests/publicAutomotiveSearchContracts.test.mjs
          ./tests/publicLaunchScopeContracts.test.mjs
          ./tests/shippingTransportSeparationContracts.test.mjs
          ./tests/listingPublicationJourneyContracts.test.mjs
          ./tests/publicSearchCancellationContracts.test.mjs
          ./tests/publicSearchCardPayloadContracts.test.mjs
          ./tests/publicListingsCancellationContracts.test.mjs
          ./tests/tourMilestone4ListingIntegration.test.mjs

      - name: Lint application
        run: npm run lint

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck migration boundary
        run: npm run typecheck:migration

      - name: Build production application
        run: npm run build

      # Keep the canonical SQL inventory downloadable for hosted staging reconciliation.
      - name: Archive canonical migration inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: automotive-migrations-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: supabase/migrations/**
